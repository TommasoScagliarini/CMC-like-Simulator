model:
  input_size: 2
  feature_names:
    - phase_sin
    - phase_cos
  output_contract: env_action
  output_coords:
    - knot_1
    - knot_2
    - knot_3
  output_channels:
    - pros_knee_angle
    - pros_ankle_angle
  hidden_size: 128
  num_layers: 1
  beta: 0.5
  threshold: 0.5
  reset_mechanism: zero
  encoding: latency
  encoding_timesteps: 1
  learn_beta: false
  learn_threshold: true

# Raw network outputs are env action values. In delta/absolute env modes they
# are normalized in [-1, 1]; in raw mode they are absolute radians. Replace
# these per-(knot, coord) values once training normalization is defined.
output_transform: identity
output_scale:
  knot_1:
    pros_knee_angle: 1.0
    pros_ankle_angle: 1.0
  knot_2:
    pros_knee_angle: 1.0
    pros_ankle_angle: 1.0
  knot_3:
    pros_knee_angle: 1.0
    pros_ankle_angle: 1.0
output_offset:
  knot_1:
    pros_knee_angle: 0.0
    pros_ankle_angle: 0.0
  knot_2:
    pros_knee_angle: 0.0
    pros_ankle_angle: 0.0
  knot_3:
    pros_knee_angle: 0.0
    pros_ankle_angle: 0.0
