[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prosthesis-snn"
version = "0.1.0"
description = "Portable SNN scaffold for prosthetic kinematic reference generation"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "snntorch>=0.9",
  "numpy",
  "PyYAML",
]

[project.optional-dependencies]
training = [
  "skrl",
  "gymnasium",
  "scipy",
]

[tool.setuptools.packages.find]
include = ["prosthesis_snn*"]
