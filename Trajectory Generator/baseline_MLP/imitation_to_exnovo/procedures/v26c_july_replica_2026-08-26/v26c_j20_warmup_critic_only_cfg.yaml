# V26C J20 - critic-only warm-up config, CRITIC-ONLY AMENDMENT.
#
# ADDITIVE. Derived from v26c_j20_warmup_cfg.yaml
#   sha256 d8bcfd39f6015eaf7a41deda2edec201e9dbe89df6c425a67f3bf14bc5e4f525
# by ONE substitution, and by nothing else:
#
#   supervision.max_minibatch_mean_kl_loss:  0.01  ->  null
#
# Everything else - model, ppo, parallelism, simulation, grf, logging, reward -
# is inherited verbatim, so the eleven substitutions that produced the J20
# config, and the 228 lines it inherited from the pinned runtime config, are
# carried through unchanged. The semantic diff is asserted by test.
#
# WHY. _enforce_kl_update_guard (train_ppo_mlp.py:716-773) runs on EVERY
# iteration and requires the four kl_update/* metrics. Those exist only when the
# custom learner is installed, and that happens only under the exact-start
# sampling contract (train_ppo_mlp.py:1380-1394). This warm-up must keep
# exact_start_sampling false, because that contract requires num_epochs 1 and
# three start offsets while July's mechanics are 10 epochs and one start.
# Guard enabled + custom learner absent means all four metrics are None and
# 7 of 7 guard checks fail, so the run would abort at iteration 1 with a
# RuntimeError. Measured, not predicted: the guard was executed as a pure
# function on the metric set the stock learner actually produces.
#
# The July critic warm-ups that succeeded carried no such guard at all: the key
# is absent from both of their resolved configs.
#
# The guard exists to catch a runaway ACTOR update. In a critic-only warm-up the
# actor and the log-std are frozen, the policy ratio is identically 1 and the KL
# is identically 0, so it cannot bind on anything. The direct evidence is
# stronger and is kept and gated: actor byte-identical, log-std byte-identical,
# and the standard policy mean KL <= 1e-09.
#
# v26c_j20_warmup_cfg.yaml is NOT modified and NOT overwritten.
# train_ppo_mlp.py is NOT modified.
#
# This file is a READINESS artefact. It authorises nothing on its own.
# Resolved training config (auto-generated): YAML + CLI overrides.
# Read by rollout_eval.py to reconstruct the trained env/model/reward.
