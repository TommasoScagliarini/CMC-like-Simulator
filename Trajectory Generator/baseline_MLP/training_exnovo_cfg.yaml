# Training ex-novo V4: policy 100 Hz, singolo q_cmd e reference model C2.
# This config is the working baseline for ex-novo reward design.

model:
  num_hidden_layers: 2
  dim_hidden_layers: 256
  fcnet_activation: tanh
  asymmetric_actor_critic: true
  freeze_actor: false
  freeze_logstd: false
  seed: 123

ppo:
  train_batch_size: 4096
  minibatch_size: 512
  num_epochs: 10
  lr: 0.0001
  gamma: 0.99
  lam: 0.9
  clip_param: 0.2
  vf_clip_param: 10.0
  vf_loss_coeff: 1.0

parallelism:
  num_env_runners: 13
  ray_num_cpus: 14

simulation:
  setup_xml: models/AB06_SEASEA_Threadmill/AB06_SEASEA_stiff321_500_pi_setup.xml
  segment_duration: 0.01
  episode_duration: 5.0
  episode_start_offset_s: 1.956870983805102 #1.956870983805102
  iterations: 100
  policy_knots: 1
  # Limit raw absolute targets before they are served to the reference model.
  # At 100 Hz these correspond to 0.025 rad/step (knee) and 0.020 rad/step
  # (ankle), preventing reset/mid-episode target jumps from punching through GRF.
  pros_knee_target_slew_rate_limit_rad_s: 2.5
  pros_ankle_target_slew_rate_limit_rad_s: 2.0
  pros_ref_governor: true
  pros_ref_model: butterworth3_jerk_limited
  pros_ref_cutoff_hz: 4.0
  pros_knee_ref_velocity_limit_rad_s: 6.0
  pros_ankle_ref_velocity_limit_rad_s: 3.5
  pros_knee_ref_acceleration_limit_rad_s2: 60.0
  pros_ankle_ref_acceleration_limit_rad_s2: 55.0
  pros_knee_ref_jerk_limit_rad_s3: 3000.0
  pros_ankle_ref_jerk_limit_rad_s3: 2750.0
  # The useful phase signal comes from online_left_gait_phase_* generated by the detector.
  gait_clock_enable: false  # NON-EXNOVO-REWARD GUARD: disables legacy sound-leg pacemaker.
  actor_cyclic_phase_only: true
  include_reference_state_observation: true
  # Expose the deployable reference-governor/previous-command state so the actor
  # observes the complete state of its own command-generation process. Derived
  # diagnostics and prescribed/biological state remain critic-only.
  include_controller_state_observation: true
  include_controller_diagnostic_observation: false
  deployable_minimal_observation: false
  imitation_initialize_to_target: false  # NON-EXNOVO-REWARD GUARD: disables sound-leg target init.
  reward_reference_range_floor: 0.05
  reward_reference_velocity_range_floor: 0.1
  random_init: false
  step_wall_timeout_s: 60.0
  # Frozen ex-novo baseline after the full-episode training_like probe:
  # soft=15 mm and hard=25 mm complete 500/500 steps and 2 valid cycles, with
  # max penetration 22.95 mm. Global env/checkpoint defaults remain unchanged.
  grf_penetration_penalty_threshold_m: 0.015
  grf_penetration_termination_m: 0.025

grf:
  grf_mode: online_sensor
  online_grf_profile: online_grf_profiles/AB06_SEASEA_stiff321_500_pi_grf_correct_magnitude.json
  online_grf_detector_profile: online_grf_profiles/AB06_SEASEA_stiff321_500_pi_grf_detector_HS-TO.json
  # Experimental detector source. Keep legacy authoritative until the paired
  # frozen-policy robustness gate promotes the two-sensor path.
  phase_fsm_input_mode: legacy_events
  phase_sensor_on_threshold_n: 5.0
  phase_sensor_off_threshold_n: 2.0
  phase_sensor_dwell_s: 0.03
  detector_sample_dt_s: 0.001
  event_contract_id: legacy_events_v1
  online_grf_observation: true
  online_grf_applied_side: [left]
  disable_prescribed_grf_side: []

reward:
  reward_mode: ex_novo

  # Ex-novo core reward, points 1-7. Prescribed-IK reference/bio scores are
  # disabled. Tracking of the policy's own command stays diagnostic-only here:
  # rewarding it allowed a no-landing swing trajectory to remain profitable.
  tracking_weight: 8.0
  reference_weight: 6.0  # NON-EXNOVO-REWARD LEGACY: inert while blend_reference is 0.
  bio_weight: 2.0  # NON-EXNOVO-REWARD LEGACY: inert while blend_bio is 0.
  blend_tracking: 0.0
  blend_reference: 0.0  # NON-EXNOVO-REWARD LEGACY: prescribed-IK score disabled.
  blend_bio: 0.0  # NON-EXNOVO-REWARD LEGACY: biological tracking score disabled.
  # Contact magnitude is a weak, provisional confidence signal. Dense credit
  # stops once minimum stance evidence is collected and is clawed back if the
  # stance fails before a valid TO.
  blend_contact_load: 0.10
  blend_contact_support_to: 0.30
  blend_phase_regular: 0.25
  clip_low: 0.0
  clip_high: 1.0

  # 1) Prosthetic stance contact/load. Magnitude saturates at a low confidence
  # threshold; it is not an absolute-GRF target and cannot grow indefinitely.
  contact_load_target_bw: 0.65
  contact_load_max_bw: 1.35
  contact_load_confidence_full_bw: 0.20
  contact_load_dense_evidence_limit_bw_s: 0.04
  # Contact load reward is valid only while GRF penetration remains in the
  # healthy/sensor-credible envelope. Above 12 mm the contact can still incur
  # penalties, but it no longer earns load support reward.
  contact_load_penetration_full_reward_m: 0.010
  contact_load_penetration_zero_reward_m: 0.012
  # A valid TO confirms provisional support credit. Full credit is available
  # only in the broad model-based stance window (1.58 s cycle * 0.50-0.80);
  # linear ramps extend to the anti-fake minimum and soft stance timeout.
  contact_support_to_window_start_s: 0.79
  contact_support_to_window_end_s: 1.26
  contact_support_failure_clawback_weight: 1.0
  prosthetic_stance_phase_end: 0.68

  # 2) Swing unloading. Penalize prosthetic vertical load when the detector says
  # swing. The tolerance is intentionally small but nonzero for sensor noise.
  swing_unloading_weight: 0.02
  swing_unloading_force_tol_bw: 0.08

  # 3) Contact validity. Penetration and ankle moment flip come from env
  # diagnostics. Online-GRF slip is kept disabled for now: it is not comparable
  # to prescribed-GRF walking data and produced false negatives in validation.
  contact_overload_weight: 0.02
  grf_slip_weight: 0.0
  grf_slip_speed_scale_m_s: 0.50
  # Online penetration is a model-specific diagnostic, not a validated strong
  # biomechanical target. The hard guard and contact-credit gate carry safety;
  # this soft term remains dense but deliberately weak.
  grf_penetration_weight: 0.05
  grf_ankle_moment_flip_weight: 0.05
  grf_ankle_moment_flip_tau_tol_nm: 8.0
  grf_ankle_moment_flip_force_threshold_n: 50.0

  # 4) Phase sequence, periodicity, and AB06 treadmill model-based timing.
  # T_nom is fixed for this first pass; future velocity-adaptive T_nom remains a
  # TODO and must not be inferred from the policy's current HS->HS period.
  phase_regularity_weight: 4.0
  phase_event_order_weight: 1.0
  phase_period_weight: 1.0
  phase_period_nominal_s: 1.58
  phase_period_soft_margin_s: 0.25
  phase_period_hard_min_s: 0.90
  phase_period_hard_max_s: 2.20
  phase_periodicity_weight: 0.5
  phase_periodicity_scale_s: 0.20
  phase_stance_fraction_weight: 0.5
  phase_stance_fraction_min: 0.50
  phase_stance_fraction_max: 0.80
  phase_timeout_weight: 0.5
  phase_stance_timeout_s: 1.45
  phase_swing_timeout_s: 0.75
  phase_timeout_scale_s: 0.20
  # 4.1) Prosthetic phase FSM / landing window.
  phase_min_stance_duration_s: 0.30
  phase_min_swing_duration_s: 0.25
  phase_landing_window_start_s: 0.35
  phase_landing_window_end_s: 0.85

  # FSM cycle ledger. Event credits are one-shot: the half-cycle credit is
  # clawed back if the current gait cycle times out or becomes invalid.
  phase_hs_event_credit: 0.10
  phase_to_event_credit: 0.20
  phase_cycle_complete_bonus: 0.70
  phase_failure_extra_penalty: 0.05
  blend_phase_event_progress: 1.00
  phase_clawback_penalty_weight: 1.00
  blend_landing_window_contact: 0.25
  phase_invalid_event_weight: 0.10
  phase_contact_validity_weight: 0.10
  # Anti-fake-cycle gates. A HS->TO->HS sequence is not counted as a completed
  # gait cycle unless stance contains real load/contact evidence and the
  # prosthetic knee actually moves; this blocks ankle-only contact oscillations.
  phase_min_stance_contact_fraction: 0.20
  phase_min_stance_load_bw_s: 0.04
  phase_min_cycle_knee_excursion_rad: 0.12
  # Timeout guard uses the standard soft/hard pattern: the Huber timeout loss is
  # subtracted post-clip, then hard timeout terminates pathological missing TO/HS.
  phase_timeout_penalty_weight: 0.50
  phase_stance_hard_timeout_s: 2.20
  phase_swing_hard_timeout_s: 1.10

  # 5) Prosthetic joint range. `oob_*` acts on commanded reference; the
  # prosthetic_joint_* band acts on actual simulated q from the prosthesis.
  oob_weight: 2.0
  oob_q_min: [-1.25, -0.60]
  oob_q_max: [0.0, 0.60]
  prosthetic_joint_range_weight: 2.0
  prosthetic_joint_q_min: [-1.30, -0.60]
  prosthetic_joint_q_max: [0.0, 0.60]

  # 6) SEA usability and command smoothness. These avoid saturation, chattering,
  # impossible motor use, and policy/controller degeneracy without prescribing a
  # desired SEA torque shape.
  effort_weight: 0.05
  smoothness_weight: 0.02
  saturation_weight: 0.10
  command_rate_weight: 0.05
  segment_delta_weight: 0.0
  qdot_ref_weight: 0.0
  qddot_ref_weight: 0.0
  jerk_ref_weight: 0.0
  reference_governor_weight: 0.0
  u_rate_weight: 0.0

  sea_saturation_weight: 0.10
  sea_torque_error_weight: 0.01
  sea_tau_spring_effort_weight: 0.0
  sea_tau_spring_rate_weight: 0.0
  sea_motor_speed_weight: 0.01
  sea_motor_accel_weight: 0.005
  sea_motor_power_weight: 0.005

  # 7) Prosthetic kinematic morphology. Each prescribed cycle is warped around
  # HS/TO and runtime phase is causally anchored to the same canonical events.
  # Weight 0.0 keeps this validated mapping diagnostic until a training A/B.
  morphology_profile: morphology_profiles/ab06_prosthetic_event_warped_mean_std_corridor.json
  morphology_phase_mode: event_anchored
  morphology_weight: 0.0
  morphology_std_multiplier_knee: 1.6
  morphology_std_multiplier_ankle: 0.6
  morphology_margin_knee_deg: 7.5
  morphology_margin_ankle_deg: 7.5

  policy_action_clip_weight: 0.25
  safety_weight: 2.0

  reserve_residual_weight: 0.0  # NON-EXNOVO-REWARD DIAGNOSTIC: simulation monitor only.
  reserve_norm_scale_nm: 500.0  # NON-EXNOVO-REWARD DIAGNOSTIC: scale for disabled term.
  residual_norm_scale_nm: 100.0  # NON-EXNOVO-REWARD DIAGNOSTIC: scale for disabled term.
  pelvis_height_weight: 0.0  # NON-EXNOVO-REWARD DIAGNOSTIC: simulation monitor only.
  pelvis_height_min_m: 0.75  # NON-EXNOVO-REWARD DIAGNOSTIC: threshold for disabled term.
  pelvis_height_scale_m: 0.10  # NON-EXNOVO-REWARD DIAGNOSTIC: scale for disabled term.

supervision:
  iteration_timeout_s: 3600.0
  sample_timeout_s: 3000.0
  startup_timeout_s: 600.0
  checkpoint_timeout_s: 240.0
  cleanup_timeout_s: 60.0
  max_consecutive_skips: 5
  max_consecutive_crash_restarts: 5
  child_self_timeout: true
  checkpoint_every: 1
  retain_iteration_checkpoints: false
  max_minibatch_mean_kl_loss: null

logging:
  tensorboard: true
  progress: true
  verbose_workers: false

run:
  output_dir: null
  resume_from: null
